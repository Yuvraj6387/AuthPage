<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuthPage</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f2f5;
    }

    .card {
      background: #fff;
      padding: 2em;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .form {
      display: none;
      flex-direction: column;
    }
    .form.active {
      display: flex;
    }

    .form input {
      padding: 0.75em;
      margin-bottom: 1em;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .form button {
      padding: 0.75em;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .toggle-link {
      margin-top: 1em;
      font-size: 0.9em;
    }

    .toggle-link a {
      color: #007bff;
      cursor: pointer;
      text-decoration: none;
    }

    .error {
      color: red;
      min-height: 1.2em;
      margin-bottom: 1em;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <form id="login-form" class="form active">
      <h2>Login</h2>
      <div class="error" id="login-error"></div>
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Login</button>
      <p class="toggle-link">Don't have an account? <a id="show-signup">Sign Up</a></p>
    </form>

    <form id="signup-form" class="form">
      <h2>Sign Up</h2>
      <div class="error" id="signup-error"></div>
      <input type="email" id="signup-email" placeholder="Email" required />
      <input type="password" id="signup-password" placeholder="Password" required />
      <input type="password" id="signup-password2" placeholder="Confirm Password" required />
      <button type="submit">Sign Up</button>
      <p class="toggle-link">Already have an account? <a id="show-login">Login</a></p>
    </form>
  </div>

  <script>
    const card = document.getElementById('card');
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    const loginError = document.getElementById('login-error');
    const signupError = document.getElementById('signup-error');
    const showSignup = document.getElementById('show-signup');
    const showLogin = document.getElementById('show-login');

    function clearErrors() {
      loginError.textContent = '';
      signupError.textContent = '';
    }

    showSignup.addEventListener('click', (e) => {
      e.preventDefault();
      loginForm.classList.remove('active');
      signupForm.classList.add('active');
      clearErrors();
    });

    showLogin.addEventListener('click', (e) => {
      e.preventDefault();
      signupForm.classList.remove('active');
      loginForm.classList.add('active');
      clearErrors();
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();
      const email = document.getElementById('signup-email').value.trim();
      const pw = document.getElementById('signup-password').value;
      const pw2 = document.getElementById('signup-password2').value;
      if (pw !== pw2) {
        signupError.textContent = 'Passwords do not match';
        return;
      }
      
      console.log('Signup →', email, pw);
      alert('Signup successful — please login');
      signupForm.reset();
      signupForm.classList.remove('active');
      loginForm.classList.add('active');
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();
      const email = document.getElementById('login-email').value.trim();
      const pw = document.getElementById('login-password').value;
      
      console.log('Login →', email, pw);
      // On successful login:
      showWelcome(email);
    });

    function showWelcome(userEmail) {
      card.innerHTML = `
        <h2>Welcome, ${userEmail}</h2>
        <button id="logout-btn">Logout</button>
      `;
      document.getElementById('logout-btn').addEventListener('click', () => {
        renderForms();
      });
    }

    function renderForms() {
      card.innerHTML = '';
      card.appendChild(loginForm);
      card.appendChild(signupForm);
      loginForm.className = 'form active';
      signupForm.className = 'form';
      clearErrors();
    }
  </script>
</body>
</html>
